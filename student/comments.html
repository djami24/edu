<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'qituvchi izohi — Education Express</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-badge">EE</div>
      <div><div class="name">Education Express</div><div class="role">Talaba paneli</div></div>
    </div>
    <div class="nav-group-title">Asosiy</div>
    <a class="nav-link" href="dashboard.html">🏠 Bosh sahifa</a>
    <a class="nav-link" href="results.html">📊 Natijalar</a>
    <a class="nav-link" href="homework.html">📝 Uy vazifalar</a>
    <a class="nav-link" href="attendance.html">🕒 Davomat</a>
    <div class="nav-group-title">Boshqa</div>
    <a class="nav-link active" href="comments.html">💬 O'qituvchi izohi</a>
    <a class="nav-link" href="menu.html">☰ Menu</a>
    <div class="sidebar-footer"><button class="btn btn-ghost" style="width:100%" onclick="logout()">Chiqish</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1>O'qituvchi izohi</h1>
    </div>

    <div class="card" style="margin-bottom:20px;" id="commentCard"></div>

    <div class="card-title" style="margin:0 0 12px;">To'lovlar <a class="link" href="payments.html">Barchasini ko'rish →</a></div>
    <div class="grid grid-2">
      <div class="card">
        <div class="li-meta">Keyingi to'lov</div>
        <div style="font-size:22px; font-weight:800; margin:8px 0 14px;" id="nextAmount">—</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="li-meta">To'lov muddati: <span id="nextDue"></span></div>
          <button class="btn btn-primary btn-sm">To'lov qilish</button>
        </div>
      </div>
      <div class="card">
        <div class="li-meta">Oxirgi to'lov</div>
        <div style="font-size:22px; font-weight:800; margin:8px 0 14px;" id="lastAmount">—</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="li-meta">To'langan sana: <span id="lastPaid"></span></div>
          <span class="pill pill-success">✓ To'landi</span>
        </div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Bosh sahifa</a>
    <a href="results.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>Natijalar</a>
    <a href="homework.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Uy vazifalar</a>
    <a href="attendance.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Davomat</a>
    <a href="menu.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Menu</a>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script>
  guardPage('student');
  const c = DEMO.teacherComments[0];
  document.getElementById('commentCard').innerHTML = `
    <div class="quote-card" style="background:transparent; padding:0;">
      <img src="${c.photo}" alt="">
      <div>
        <div class="q-name">${c.teacher}</div>
        <div class="q-date">${c.date}</div>
        <div class="q-text">"${c.text}"</div>
      </div>
    </div>`;

  const p = DEMO.payments;
  document.getElementById('nextAmount').textContent = p.next.amount + " so'm";
  document.getElementById('nextDue').textContent = p.next.due;
  document.getElementById('lastAmount').textContent = p.last.amount + " so'm";
  document.getElementById('lastPaid').textContent = p.last.paid;
</script>
</body>
</html>
