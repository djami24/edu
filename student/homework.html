<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="../js/firebase-config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script>
  guardPage('student');

  function statusMeta(status){
    if(status === 'done') return { pill:'pill-success', text:'Topshirilgan' };
    if(status === 'checking') return { pill:'pill-info', text:'Tekshirilmoqda' };
    return { pill:'pill-danger', text:'Topshirilmagan' };
  }

  function renderHomeworks(filter = 'all'){
    const list = document.getElementById('hwList');
    list.innerHTML = '';
    let items = DEMO.homeworks;
    if(filter === 'done') items = items.filter(h => h.status === 'done');
    if(filter === 'missed') items = items.filter(h => h.status === 'missed');

    items.forEach(hw => {
      const m = statusMeta(hw.status);
      const scoreBadge = hw.score ? `<div class="pill pill-success" style="font-size:16px;padding:8px 16px;">${hw.score}%</div>` : `<span class="pill ${m.pill}">${m.text}</span>`;
      const card = document.createElement('div');
      card.className = 'card';
      card.style.marginBottom = '14px';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
          <div>
            <div class="li-title" style="font-size:16px;">${hw.title}</div>
            <div class="li-meta">Berilgan sana: ${hw.given}</div>
            <div class="li-meta">Topshirish muddati: ${hw.due}</div>
            <span class="pill ${m.pill}" style="margin-top:8px;">${m.text}</span>
          </div>
          ${hw.score ? scoreBadge : ''}
        </div>`;
      list.appendChild(card);
    });

    if(items.length === 0){
      list.innerHTML = `<div class="card" style="text-align:center; color:var(--color-text-muted);">Bu bo'limda hozircha vazifalar yo'q</div>`;
    }
  }

  document.querySelectorAll('#filterTabs .tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filterTabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderHomeworks(btn.dataset.filter);
    });
  });

  renderHomeworks();
</script>
</body>
</html>
