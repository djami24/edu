<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talabalar progressi — Education Express</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="logo-badge">EE</div><div><div class="name">Education Express</div><div class="role">O'qituvchi paneli</div></div></div>
    <div class="nav-group-title">Asosiy</div>
    <a class="nav-link" href="dashboard.html">🏠 Bosh sahifa</a>
    <a class="nav-link" href="groups.html">👥 Mening guruhlarim</a>
    <a class="nav-link active" href="students.html">🎓 Talabalar progressi</a>
    <div class="nav-group-title">Ish jarayoni</div>
    <a class="nav-link" href="attendance.html">🕒 Davomat belgilash</a>
    <a class="nav-link" href="homework.html">📝 Uy vazifa berish</a>
    <a class="nav-link" href="tests.html">📄 Test yaratish</a>
    <a class="nav-link" href="comments.html">💬 Haftalik izohlar</a>
    <a class="nav-link" href="announcements.html">📢 E'lonlar</a>
    <div class="sidebar-footer"><button class="btn btn-ghost" style="width:100%" onclick="logout()">Chiqish</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><h1>Talabalar progressi</h1><p class="subtitle">Barcha guruhlaringizdagi talabalar</p></div>
    </div>

    <div class="card">
      <div class="table-toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Talaba nomi bo'yicha qidirish...">
        </div>
      </div>
      <table class="table">
        <thead><tr><th>Talaba</th><th>Guruh</th><th>Davomat</th><th>Progress</th><th>Holat</th></tr></thead>
        <tbody id="stBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script>
  guardPage('teacher');

  // Haqiqiy loyihada: db.collection('students').where('teacherId','==',uid).get()
  const myStudents = DEMO.students.filter(s => s.teacher === 'Mr. Abdurahim');
  let query = '';

  function renderTable(){
    const filtered = filterList(myStudents, query, ['name','group']);
    const tbody = document.getElementById('stBody');
    if(filtered.length === 0){
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--color-text-muted); padding:30px;">Hech narsa topilmadi</td></tr>`;
    } else {
      tbody.innerHTML = filtered.map(s => `
        <tr>
          <td style="display:flex; align-items:center; gap:10px;"><img class="avatar-sm" src="${s.photo}"><span style="font-weight:600;">${s.name}</span></td>
          <td>${s.group}</td>
          <td>${s.attendance}%</td>
          <td>
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="progress-track" style="width:100px;"><div class="progress-fill ${s.attendance < 75 ? 'warn' : ''}" style="width:${s.attendance}%"></div></div>
            </div>
          </td>
          <td><span class="pill ${s.status === 'active' ? 'pill-success' : 'pill-danger'}">${s.status === 'active' ? 'Faol' : 'Nofaol'}</span></td>
        </tr>`).join('');
    }
  }

  document.getElementById('searchInput').addEventListener('input', (e) => { query = e.target.value; renderTable(); });
  renderTable();
</script>
</body>
</html>
