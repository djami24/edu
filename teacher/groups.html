  document.getElementById('groupsGrid').innerHTML = myGroups.map(g => `
    <div class="card">
      <div class="card-title">${g.name}</div>
      <div class="li-meta" style="margin-bottom:10px;">${g.level}</div>
      <div class="list-item"><div class="li-title">Talabalar soni</div><span class="li-meta">${g.students}</span></div>

        <a class="btn btn-ghost btn-sm" style="flex:1; text-align:center;" href="students.html">Talabalarni ko'rish</a>
