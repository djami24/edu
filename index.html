<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Express — Kirish</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">EE</div>
    <h1 class="auth-title">Education Express</h1>
    <p class="auth-subtitle">Ta'lim boshqaruv tizimiga xush kelibsiz</p>

    <div class="role-tabs">
      <button class="role-tab" data-role="admin">Admin</button>
      <button class="role-tab" data-role="teacher">O'qituvchi</button>
      <button class="role-tab active" data-role="student">Talaba</button>
      <button class="role-tab" data-role="parent">Ota-ona</button>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" value="demo@educationexpress.uz" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Parol</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" value="demo1234" required>
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Kirish</button>
    </form>

    <p class="auth-demo-hint">
      Demo rejimi yoqilgan — istalgan email/parol bilan, yuqoridan<br>
      rolni tanlab "Kirish" tugmasini bosing.
    </p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
