<html lang="uz">
<head>

<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="logo-badge">EE</div><div><div class="name">Education Express</div><div class="role">Admin paneli</div></div></div>
    <div class="nav-group-title">Umumiy</div>
    <a class="nav-link" href="dashboard.html">🏠 Dashboard</a>
    <a class="nav-link" href="reports.html">📈 Hisobotlar</a>
    <div class="nav-group-title">Boshqaruv</div>
    <a class="nav-link" href="students.html">🎓 Talabalar</a>
    <a class="nav-link" href="parents.html">👪 Ota-onalar</a>
    <a class="nav-link" href="teachers.html">👩‍🏫 O'qituvchilar</a>
    <a class="nav-link" href="groups.html">👥 Guruhlar</a>
    <a class="nav-link" href="courses.html">📘 Kurslar</a>
    <a class="nav-link" href="attendance.html">🕒 Davomat</a>
    <a class="nav-link" href="homework.html">📝 Uy vazifalar</a>
    <a class="nav-link" href="exams.html">📄 Test/Imtihonlar</a>
    <a class="nav-link" href="payments.html">💳 To'lovlar</a>
    <div class="nav-group-title">Tizim</div>
    <a class="nav-link active" href="notifications.html">🔔 Bildirishnomalar</a>
    <a class="nav-link" href="settings.html">⚙️ Sozlamalar</a>
    <div class="sidebar-footer"><button class="btn btn-ghost" style="width:100%" onclick="logout()">Chiqish</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-toggle icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><h1>Bildirishnomalar</h1><p class="subtitle">Tizimdagi so'nggi bildirishnomalar</p></div>
      <button class="btn btn-primary" style="width:auto;" id="addBtn">+ Yangi e'lon</button>
    </div>

    <div class="card" id="notifCard"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script>
  guardPage('admin');

  const pillFor = { info:'pill-info', warning:'pill-warning', success:'pill-success' };
  const labelFor = { info:'Yangi', warning:'Eslatma', success:'Bajarildi' };

  document.getElementById('notifCard').innerHTML = DEMO.notificationsAdmin.map(n => `
    <div class="list-item">
      <div><div class="li-title">${n.text}</div><div class="li-meta">${n.time}</div></div>
      <span class="pill ${pillFor[n.type]}">${labelFor[n.type]}</span>
    </div>`).join('');

  document.getElementById('addBtn').addEventListener('click', () => {
    showToast("Yangi e'lon yaratish oynasi ochiladi (demo)", 'info');
  });
</script>
</body>
</html>
